name: "🐛 Ошибка / Bug report"
description: "Сообщить о воспроизводимой ошибке / Report a reproducible bug"
body:
  - type: markdown
    attributes:
      value: |
        Не прикладывайте токен бота, .env, базу пользователей или полные логи.
        Do not include your bot token, .env, user database or unredacted logs.
        Для уязвимостей используйте SECURITY.md / For vulnerabilities, see SECURITY.md.
  - type: textarea
    id: steps
    attributes:
      label: "Шаги воспроизведения / Steps to reproduce"
      description: "Что отправили боту и какие настройки выбрали?"
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: "Ожидаемый и фактический результат / Expected and actual result"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "Версии / Versions"
      placeholder: "OS, Python, aiogram, commit or release"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Обезличенная ошибка / Redacted error"
      render: text
