[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "emoji-sticker-info-bot"
version = "1.0.0"
description = "Telegram bot that resolves custom emoji, sticker and sticker-set IDs"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "shirstylee"}]
keywords = ["telegram", "emoji", "stickers", "aiogram", "bot"]
dependencies = [
    "aiogram>=3.26,<4",
    "aiosqlite>=0.21,<1",
    "emoji>=2.14,<3",
    "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.2,<2",
    "build>=1.2,<2",
    "pip-audit>=2.9,<3",
]

[project.urls]
Repository = "https://github.com/shirstylee/emoji-sticker-info-bot"
Issues = "https://github.com/shirstylee/emoji-sticker-info-bot/issues"

[project.scripts]
emoji-sticker-info-bot = "emoji_id_bot.main:run"

[tool.setuptools.packages.find]
include = ["emoji_id_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
